name: Build PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles each document in its own directory so that relative figure
      # paths resolve, and keeps going after a failure so one broken document
      # doesn't hide the others.
      - name: Compile every LaTeX document
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/xu-cheng/texlive-full:latest sh -c '
              status=0
              for f in assignments/*.tex exams/*.tex notes/*.tex projects/*/writeup.tex; do
                echo "::group::latexmk $f"
                if latexmk -pdf -cd -file-line-error -interaction=nonstopmode "$f"; then
                  echo "::endgroup::"
                else
                  echo "::endgroup::"
                  echo "::error file=$f::LaTeX compilation failed"
                  status=1
                fi
              done
              exit $status
            '

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          # Keep each PDF at the same relative path as its source.
          find assignments exams notes projects -name '*.pdf' -print0 |
            while IFS= read -r -d '' pdf; do
              mkdir -p "_site/$(dirname "$pdf")"
              cp "$pdf" "_site/$pdf"
            done
          echo "Published files:"
          find _site -type f | sort

      - name: Verify every linked PDF exists
        run: |
          missing=0
          grep -o 'href="[^"]*\.pdf"' web/index.html | sed 's/href="//; s/"$//' > links.txt
          while read -r link; do
            if [ ! -f "_site/$link" ]; then
              echo "::error::index.html links to $link but it was not built"
              missing=1
            fi
          done < links.txt
          rm -f links.txt
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
